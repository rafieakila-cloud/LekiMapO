<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101b20" />
    <meta name="description" content="Jelajahi kota dunia melalui peta 3D interaktif LekiMapO." />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>LekiMapO — peta interaktif</title>
  </head>
  <body>
    <div class="app">
      <aside class="rail">
        <a class="brand" href="#" aria-label="LekiMapO beranda">
          <span class="brand-icon"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="m4 8 8-4 8 4 8-4v20l-8 4-8-4-8 4V8Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="m12 4 0 20M20 8v20" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M16 9c-2.6 0-4.3 1.8-4.3 4.1 0 3.1 4.3 7 4.3 7s4.3-3.9 4.3-7C20.3 10.8 18.6 9 16 9Z" fill="#c6ef92"/><circle cx="16" cy="13" r="1.3" fill="#142329"/></svg></span>
          <span class="brand-name">Leki<span>MapO</span></span>
        </a>
        <div class="rail-rule"></div>
        <button class="rail-action active" id="explore-tab" type="button" aria-label="Jelajahi peta" title="Jelajahi"><span>⌖</span></button>
        <button class="rail-action" id="locate-button" type="button" aria-label="Lokasi saya" title="Lokasi saya"><span>◎</span></button>
        <button class="rail-action" id="saved-button" type="button" aria-label="Tempat tersimpan" title="Tempat tersimpan"><span>☆</span></button>
        <div class="rail-spacer"></div>
        <span class="rail-foot">PETA<br />DUNIA</span>
      </aside>

      <main class="map-shell">
        <div id="map" aria-label="Peta interaktif dunia dengan bangunan 3D"></div>
        <header class="top-overlay">
          <div class="search-wrap">
            <span class="search-icon">⌕</span>
            <input id="place-search" type="search" autocomplete="off" placeholder="Cari kota, negara, atau tempat..." aria-label="Cari lokasi" />
            <kbd>Ctrl K</kbd>
            <div id="search-results" class="search-results" hidden></div>
          </div>
          <div class="top-badge"><span class="live-dot"></span><span>PETA 3D INTERAKTIF</span></div>
        </header>

        <div class="map-controls">
          <button id="tilt-button" class="map-control" type="button" title="Bangunan 3D memakai data peta yang tidak real-time" aria-label="Aktifkan tampilan 3D">3D</button>
          <span class="control-divider"></span>
          <button id="zoom-in" class="map-control" type="button" aria-label="Perbesar">＋</button>
          <button id="zoom-out" class="map-control" type="button" aria-label="Perkecil">−</button>
          <span class="control-divider"></span>
          <button id="compass" class="map-control compass" type="button" aria-label="Atur ulang arah utara">↑</button>
        </div>

        <div class="map-attribution"><span class="map-status-dot"></span> Bangunan 3D memakai data peta, bukan real-time · © OpenStreetMap</div>

        <aside id="place-card" class="place-card" aria-live="polite">
          <div class="card-loading">
            <span class="card-kicker"><span class="live-dot"></span> PETA JELAJAH DUNIA</span>
            <h1>Kota, lebih<br /><span>dekat.</span></h1>
            <p>Cari kota atau tempat, lalu pilih nama yang cocok untuk membuka peta, kisah, foto, kuliner sekitar, dan cuaca.</p>
            <button id="explore-jakarta" class="discover-link" type="button">Jelajahi Jakarta <span>↗</span></button>
          </div>
        </aside>

        <div id="toast" class="toast" role="status" aria-live="polite"></div>
      </main>
    </div>
    <dialog id="saved-dialog" class="modal">
      <div class="modal-card saved-card" aria-labelledby="saved-title">
        <button class="modal-close" type="button" data-close aria-label="Tutup">×</button>
        <p class="eyebrow">KOLEKSI PRIBADI</p>
        <h2 id="saved-title">Tempat tersimpan</h2>
        <div id="saved-list" class="saved-list"></div>
      </div>
    </dialog>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
